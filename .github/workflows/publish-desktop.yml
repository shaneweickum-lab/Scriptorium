name: Publish Desktop App

# Triggers on any tag like v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon
          - platform: macos-latest
            args: --target aarch64-apple-darwin

          # macOS — Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin

          # Linux — x86_64
          - platform: ubuntu-22.04
            args: ''

          # Windows — x86_64
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS targets in one job runner
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Wizards Playground ${{ github.ref_name }}
          releaseBody: |
            ## Download

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `Wizards.Playground_*_aarch64.dmg` |
            | macOS (Intel) | `Wizards.Playground_*_x64.dmg` |
            | Windows | `Wizards.Playground_*_x64_en-US.msi` |
            | Linux (Debian/Ubuntu) | `wizards-playground_*_amd64.deb` |
            | Linux (AppImage) | `wizards-playground_*_amd64.AppImage` |

            ### What's new
            See commit history for changes in this release.

            ### Requirements
            - [Ollama](https://ollama.com) running locally (`ollama serve`)
            - No CORS configuration needed — the desktop app connects directly.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
