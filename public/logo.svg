<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a3d"/>
      <stop offset="100%" stop-color="#000510"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="250" cy="250" r="250" fill="url(#bg)"/>

  <!-- Outer magical aura -->
  <circle cx="250" cy="250" r="195" fill="url(#orb)" filter="url(#blur-md)"/>

  <!-- Constellation outer ring - dots -->
  <g fill="#38bdf8" opacity="0.9">
    <circle cx="250" cy="58" r="4"/>
    <circle cx="333" cy="79" r="3"/>
    <circle cx="399" cy="134" r="3.5"/>
    <circle cx="434" cy="213" r="3"/>
    <circle cx="430" cy="300" r="4"/>
    <circle cx="384" cy="374" r="3"/>
    <circle cx="310" cy="422" r="3.5"/>
    <circle cx="232" cy="432" r="3"/>
    <circle cx="155" cy="410" r="4"/>
    <circle cx="96" cy="360" r="3"/>
    <circle cx="64" cy="285" r="3.5"/>
    <circle cx="68" cy="200" r="3"/>
    <circle cx="108" cy="128" r="4"/>
    <circle cx="174" cy="77" r="3"/>
  </g>

  <!-- Constellation lines connecting outer dots -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.35" fill="none">
    <line x1="250" y1="58" x2="333" y2="79"/>
    <line x1="333" y1="79" x2="399" y2="134"/>
    <line x1="399" y1="134" x2="434" y2="213"/>
    <line x1="434" y1="213" x2="430" y2="300"/>
    <line x1="430" y1="300" x2="384" y2="374"/>
    <line x1="384" y1="374" x2="310" y2="422"/>
    <line x1="310" y1="422" x2="232" y2="432"/>
    <line x1="232" y1="432" x2="155" y2="410"/>
    <line x1="155" y1="410" x2="96" y2="360"/>
    <line x1="96" y1="360" x2="64" y2="285"/>
    <line x1="64" y1="285" x2="68" y2="200"/>
    <line x1="68" y1="200" x2="108" y2="128"/>
    <line x1="108" y1="128" x2="174" y2="77"/>
    <line x1="174" y1="77" x2="250" y2="58"/>
    <!-- Cross-connections -->
    <line x1="250" y1="58" x2="108" y2="128"/>
    <line x1="333" y1="79" x2="434" y2="213"/>
    <line x1="430" y1="300" x2="310" y2="422"/>
    <line x1="96" y1="360" x2="174" y2="77"/>
  </g>

  <!-- Inner runic ring -->
  <circle cx="250" cy="250" r="168" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.6"/>
  <circle cx="250" cy="250" r="156" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.4"/>

  <!-- Swirling energy bands -->
  <path d="M 250 82 C 350 95, 420 165, 420 250 C 420 340, 345 408, 250 415 C 160 408, 88 340, 82 250 C 80 160, 148 95, 250 82"
    fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0.5" stroke-dasharray="8,4"/>
  <path d="M 250 90 C 162 100, 95 172, 92 258 C 89 348, 162 415, 250 416 C 340 415, 410 345, 412 258 C 414 172, 342 100, 250 90"
    fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.45" stroke-dasharray="6,5"/>

  <!-- Central glow -->
  <circle cx="250" cy="230" r="90" fill="#4f46e5" opacity="0.12" filter="url(#blur-md)"/>
  <circle cx="250" cy="230" r="50" fill="#7c3aed" opacity="0.18" filter="url(#blur-sm)"/>

  <!-- Open book body -->
  <g filter="url(#glow-filter)">
    <!-- Left page -->
    <path d="M 145 265 C 145 240, 160 228, 190 222 L 248 218 L 248 308 L 190 310 C 162 312, 145 300, 145 275 Z"
      fill="#1e3a6e" stroke="#60a5fa" stroke-width="1.8"/>
    <!-- Right page -->
    <path d="M 355 265 C 355 240, 340 228, 310 222 L 252 218 L 252 308 L 310 310 C 338 312, 355 300, 355 275 Z"
      fill="#1e3a6e" stroke="#60a5fa" stroke-width="1.8"/>
    <!-- Book spine -->
    <path d="M 248 218 L 252 218 L 252 308 L 248 308 Z" fill="#2563eb"/>
    <!-- Page shimmer lines - left -->
    <line x1="165" y1="240" x2="240" y2="236" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
    <line x1="162" y1="252" x2="240" y2="248" stroke="#93c5fd" stroke-width="0.8" opacity="0.4"/>
    <line x1="160" y1="264" x2="240" y2="260" stroke="#93c5fd" stroke-width="0.8" opacity="0.4"/>
    <line x1="160" y1="276" x2="240" y2="272" stroke="#93c5fd" stroke-width="0.8" opacity="0.35"/>
    <line x1="162" y1="288" x2="240" y2="284" stroke="#93c5fd" stroke-width="0.8" opacity="0.3"/>
    <!-- Page shimmer lines - right -->
    <line x1="260" y1="236" x2="335" y2="240" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
    <line x1="260" y1="248" x2="338" y2="252" stroke="#93c5fd" stroke-width="0.8" opacity="0.4"/>
    <line x1="260" y1="260" x2="340" y2="264" stroke="#93c5fd" stroke-width="0.8" opacity="0.4"/>
    <line x1="260" y1="272" x2="340" y2="276" stroke="#93c5fd" stroke-width="0.8" opacity="0.35"/>
    <line x1="260" y1="284" x2="338" y2="288" stroke="#93c5fd" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Book starfield shimmer -->
  <g fill="#93c5fd" opacity="0.6">
    <circle cx="185" cy="255" r="1"/>
    <circle cx="200" cy="275" r="1.2"/>
    <circle cx="220" cy="245" r="0.8"/>
    <circle cx="175" cy="285" r="1"/>
    <circle cx="280" cy="258" r="1"/>
    <circle cx="300" cy="272" r="1.2"/>
    <circle cx="318" cy="248" r="0.8"/>
    <circle cx="295" cy="290" r="1"/>
  </g>

  <!-- Wand/staff -->
  <g filter="url(#glow-filter)">
    <line x1="250" y1="134" x2="250" y2="218" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="250" y1="134" x2="250" y2="218" stroke="#bfdbfe" stroke-width="1.2" opacity="0.7"/>
    <!-- Wand wrap spirals -->
    <path d="M 244 155 Q 250 160, 256 155 Q 250 150, 244 155" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <path d="M 244 172 Q 250 177, 256 172 Q 250 167, 244 172" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <path d="M 244 189 Q 250 194, 256 189 Q 250 184, 244 189" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  </g>

  <!-- Crystal gem at top of wand -->
  <g filter="url(#glow-filter)">
    <!-- Glow behind crystal -->
    <circle cx="250" cy="120" r="22" fill="#a78bfa" opacity="0.35" filter="url(#blur-sm)"/>
    <circle cx="250" cy="120" r="14" fill="#c4b5fd" opacity="0.25" filter="url(#blur-sm)"/>
    <!-- Crystal facets -->
    <polygon points="250,100 264,115 260,132 250,138 240,132 236,115"
      fill="#312e81" stroke="#a78bfa" stroke-width="1.5"/>
    <polygon points="250,100 264,115 250,112"
      fill="#4338ca" opacity="0.9"/>
    <polygon points="250,100 236,115 250,112"
      fill="#6d28d9" opacity="0.8"/>
    <polygon points="264,115 260,132 250,125 250,112"
      fill="#3730a3" opacity="0.85"/>
    <polygon points="236,115 240,132 250,125 250,112"
      fill="#4f46e5" opacity="0.8"/>
    <!-- Crystal highlight -->
    <polygon points="250,100 257,108 253,106" fill="#e0e7ff" opacity="0.7"/>
    <!-- Crystal tip glow -->
    <circle cx="250" cy="101" r="4" fill="#c4b5fd" opacity="0.9"/>
  </g>

  <!-- Quill feather -->
  <g transform="translate(250,250) rotate(-35) translate(-250,-250)" filter="url(#glow-filter)">
    <!-- Feather spine -->
    <line x1="262" y1="178" x2="228" y2="290" stroke="#93c5fd" stroke-width="1.5" opacity="0.8"/>
    <!-- Feather left barbs -->
    <path d="M 261 185 C 240 195, 230 205, 242 210" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.7"/>
    <path d="M 258 198 C 237 208, 228 216, 238 222" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.7"/>
    <path d="M 255 211 C 234 218, 226 228, 236 232" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.65"/>
    <path d="M 251 225 C 232 230, 224 240, 233 244" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
    <!-- Feather right barbs -->
    <path d="M 261 185 C 278 195, 284 205, 272 210" fill="none" stroke="#a5f3fc" stroke-width="1" opacity="0.6"/>
    <path d="M 258 198 C 274 208, 278 218, 267 222" fill="none" stroke="#a5f3fc" stroke-width="1" opacity="0.6"/>
    <path d="M 255 211 C 270 218, 272 228, 262 232" fill="none" stroke="#a5f3fc" stroke-width="1" opacity="0.55"/>
    <!-- Feather fill -->
    <path d="M 261 185 C 278 200, 276 230, 251 270 C 228 250, 225 220, 261 185 Z"
      fill="#1e40af" opacity="0.35"/>
  </g>

  <!-- Extra energy sparks -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="218" cy="148" r="1.5"/>
    <circle cx="282" cy="152" r="1.2"/>
    <circle cx="230" cy="130" r="1"/>
    <circle cx="272" cy="138" r="1.5"/>
  </g>
  <g fill="#60a5fa" opacity="0.7">
    <circle cx="210" cy="165" r="1.2"/>
    <circle cx="292" cy="162" r="1"/>
    <circle cx="295" cy="178" r="1.5"/>
  </g>
</svg>
